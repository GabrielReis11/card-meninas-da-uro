<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Meninas da Uro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="h-100 d-flex justify-content-center align-items-center">
        <div class="container d-flex justify-content-center">
            <div class="col-12 d-flex justify-content-center">
                <div class="cartao">
                    <div class="foto-container">
                        <img src="assets/images/foto-meninas.png" class="foto-emily" alt="Dra Emily Ricaldi">
                    </div>
                    <div class="container" style="margin-top: 100px">
                        <div class="row d-flex justify-content-center">

                            <!-- Nomes das médicas -->
                            <div class="col-12 text-center nomes-medicas">
                                <div class="faixa faixa-marrom">DRA. EMILY RICALDI</div>
                                <div class="faixa faixa-verde">DRA. DIANDRA CARVALHAL</div>
                            </div>

                            <!-- Botões como links -->
                            <div class="col-9">
                                <a href="assets/docs/resumo.pdf" class="botao">
                                    <span class="texto">SOBRE NÓS</span>
                                    <span class="icone icone-marrom">
                                      <i class="bi bi-people-fill"></i>
                                    </span>
                                </a>
                            </div>

                            <div class="col-9">
                                <a href="https://wa.me/557197103059" class="botao icone-left">
                                    <span class="icone icone-esquerda icone-verde">
                                      <i class="bi bi-calendar-check"></i>
                                    </span>
                                    <span class="texto">AGENDE SUA CONSULTA</span>
                                </a>
                            </div>

                            <div class="col-9">
                                <a href="https://www.instagram.com/asmeninasdauro/" class="botao">
                                    <span class="texto">REDES SOCIAIS</span>
                                    <span class="icone icone-marrom">
                                      <i class="bi bi-instagram"></i>
                                    </span>
                                </a>
                            </div>

                            <div class="col-9">
                                <a href="assets/docs/atendimentos-att.pdf" class="botao icone-left">
                                    <span class="icone icone-esquerda icone-verde">
                                      <i class="bi bi-geo-alt-fill"></i>
                                    </span>
                                    <span class="texto">CLÍNICA MAIS PRÓXIMA</span>
                                </a>
                            </div>

                        </div>
                    </div>

                    <img src="assets/images/logo-marca-diandra.png" alt="" class="img-bg-bottom">
                    <img src="assets/images/logo-marca-emily.png" alt="" class="img-bg-top">

                </div>
            </div>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</html>
